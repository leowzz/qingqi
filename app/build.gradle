plugins { id 'com.android.application' }
android {
    namespace 'local.leo.qingqi'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'local.leo.qingqi'
        minSdk 31
        targetSdk 36
        versionCode 3
        versionName '0.1.2-preview'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') } }
    lint { abortOnError true }
}
