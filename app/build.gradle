plugins { id 'com.android.application' }
def signingEnv = ['QINGQI_KEYSTORE', 'QINGQI_STORE_PASSWORD', 'QINGQI_KEY_ALIAS', 'QINGQI_KEY_PASSWORD']
def fixedSigning = signingEnv.collectEntries { [(it): System.getenv(it)] }
if (fixedSigning.values().any { it } && !fixedSigning.values().every { it }) {
    throw new GradleException('Fixed signing requires all QINGQI signing environment variables')
}
android {
    namespace 'local.leo.qingqi'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'local.leo.qingqi'
        minSdk 31
        targetSdk 36
        versionCode 6
        versionName '0.1.5-field'
        testInstrumentationRunner 'local.leo.qingqi.StorageTestRunner'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (fixedSigning.QINGQI_KEYSTORE) {
            field {
                storeFile file(fixedSigning.QINGQI_KEYSTORE)
                storePassword fixedSigning.QINGQI_STORE_PASSWORD
                keyAlias fixedSigning.QINGQI_KEY_ALIAS
                keyPassword fixedSigning.QINGQI_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug { if (fixedSigning.QINGQI_KEYSTORE) signingConfig signingConfigs.field }
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') }
    }
    lint { abortOnError true }
}
